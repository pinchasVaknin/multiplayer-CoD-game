    <title>PROTOCOL SEVEN — skin thumbnail</title>

    -->
    <link rel="stylesheet" href="/src/client/ui/styles/tokens.css" />
    <link rel="stylesheet" href="/src/client/ui/styles/app.css" />
    <link rel="stylesheet" href="/src/client/ui/styles/meta.css" />

      body { background: transparent; }
      .lo-stage__canvas { width: 320px; height: 400px; background: none; border-radius: 0; }
    </style>

    <script type="module" src="/src/client/probes/skinThumb.ts"></script>
