name: CI

# M9, S6.3: "enforced in CI, not by discipline."
#
# There was no CI before this milestone. The partition between shared/, client/ and server/
# is the first thing in this project that a human cannot be trusted to remember for two more
# milestones, so it gets a machine that checks every push.
#
# The boundary check runs first and on its own. If shared/ has grown an import of client/,
# every type error after it is noise about a symbol that should not have been reachable —
# and a wall of noise is how a real failure gets scrolled past.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Target boundaries (shared/ must load in Node)
        run: npm run check:boundaries

      - name: Typecheck — shared (no DOM lib)
        run: npm run typecheck:shared

      - name: Typecheck — client
        run: npm run typecheck:client

      - name: Typecheck — server (no DOM lib, Node types)
        run: npm run typecheck:server

      - name: Production build (browser)
        run: npx vite build

      - name: Server build (Node)
        run: npm run build:server

      # The M9 gate, as a CI step. A short cap rather than a full match: the point here is
      # that the simulation still boots, bakes a navmesh, spawns bots and ticks in Node with
      # no display — not to re-play a five-minute match on every push. `--asap` keeps it to
      # seconds; the real stability run is `npm run harness`.
      - name: Headless smoke — 60s of simulation, no browser
        run: node dist-server/main.js --minutes 1 --asap --json

      # S6.6. Node writes its per-tick hashes and the fingerprint is compared against the
      # value committed below. A change here means the simulation changed — which is either
      # intentional (update the constant, in a commit that says why) or the determinism bug
      # this whole phase exists to catch.
      - name: Cross-runtime determinism — Node half
        run: |
          node dist-server/hashRun.js --out node-hashes.json
          node scripts/diff-hashes.mjs node-hashes.json node-hashes.json
